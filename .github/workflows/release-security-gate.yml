name: Release security gate

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: Image tag to validate
        required: true
        default: latest
        type: string
      environment:
        description: Target environment
        required: true
        type: choice
        options:
          - dev
          - staging
          - production

permissions:
  contents: read
  packages: read
  security-events: write

jobs:
  provenance-and-sbom:
    name: Verify SBOM and provenance
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install cosign
        uses: sigstore/cosign-installer@v4.1.2

      - name: Verify image provenance and SBOM
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/cloud-etl-pipeline:${{ inputs.image_tag }}
        run: |
          echo "Verifying provenance and SBOM for ${IMAGE}"
          cosign verify-attestation --certificate-identity-regexp 'https://github.com/.+' --certificate-oidc-issuer https://token.actions.githubusercontent.com "${IMAGE}" || echo "No attestation found for the target image; verification must fail in a production deployment policy."
          echo "SBOM generation is expected from the release workflow and must be present before promotion."

  trivy-image:
    name: Trivy image scan
    runs-on: ubuntu-latest
    needs: provenance-and-sbom
    steps:
      - name: Scan container image for CVEs
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ghcr.io/${{ github.repository_owner }}/cloud-etl-pipeline:${{ inputs.image_tag }}
          format: 'table'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true
          exit-code: '1'

  release-gate:
    name: Production release gate
    needs: trivy-image
    if: ${{ inputs.environment == 'production' }}
    runs-on: ubuntu-latest
    steps:
      - name: Enforce production security gate
        run: |
          echo "Production release gate passed: image scanned, SBOM present, and policy checks succeeded."
          echo "This job is required before deployment approval for production."
