stages:
  - quality
  - test
  - container
  - infrastructure

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH'

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  PYTHONPATH: "$CI_PROJECT_DIR"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  POSTGRES_DB: etl_db
  POSTGRES_USER: postgres
  POSTGRES_PASSWORD: postgres
  TEST_DATABASE_URL: "postgresql+psycopg2://postgres:postgres@postgres:5432/etl_db"

.python:
  image: python:3.11-slim
  cache:
    key:
      files:
        - requirements.txt
    paths:
      - .cache/pip/
  before_script:
    - python -m pip install --upgrade pip
    - pip install -r requirements.txt

quality:
  extends: .python
  stage: quality
  script:
    - flake8 src tests --count --select=E9,F63,F7,F82 --show-source --statistics
    - black --check src tests
    - isort --check-only src tests
    - python -m compileall -q src ingest etl tests dags

tests:
  extends: .python
  stage: test
  services:
    - name: postgres:15
      alias: postgres
  variables:
    POSTGRES_HOST: postgres
    POSTGRES_PORT: "5432"
  script:
    - mkdir -p test_artifacts
    - set -o pipefail
    - pytest --ignore=tests/test_perf_copy.py --cov=src --cov-report=xml:coverage.xml --junitxml=test_artifacts/junit.xml 2>&1 | tee test_artifacts/pytest.log
  artifacts:
    when: always
    expire_in: 14 days
    reports:
      junit: test_artifacts/junit.xml
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml
    paths:
      - test_artifacts/
      - coverage.xml
  coverage: '/TOTAL\s+\d+\s+\d+\s+(\d+(?:\.\d+)?%)/'

container:
  stage: container
  image: docker:27-cli
  services:
    - name: docker:27-dind
      alias: docker
  variables:
    DOCKER_HOST: tcp://docker:2376
    DOCKER_TLS_CERTDIR: "/certs"
    DOCKER_TLS_VERIFY: "1"
    DOCKER_CERT_PATH: "$DOCKER_TLS_CERTDIR/client"
  before_script:
    - docker info
    - cp .env.example .env
  script:
    - docker build --pull -t cloud-etl-pipeline:$CI_COMMIT_SHORT_SHA .
    - docker compose config --quiet
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'

terraform:
  stage: infrastructure
  image:
    name: hashicorp/terraform:1.8
    entrypoint: [""]
  script:
    - terraform fmt -check -recursive infra/aws/data_lake
    - cd infra/aws/data_lake
    - terraform init -backend=false
    - terraform validate
  rules:
    - changes:
        - infra/aws/data_lake/**/*
        - .gitlab-ci.yml
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
