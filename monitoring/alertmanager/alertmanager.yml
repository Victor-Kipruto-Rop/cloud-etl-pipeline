global:
  resolve_timeout: 5m

route:
  receiver: 'default'
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 3h

receivers:
  - name: 'default'
    # Update or add receivers below (slack, email). Use environment variables
    # to inject secrets instead of committing them directly.
    slack_configs:
      - api_url: '${SLACK_WEBHOOK_URL}'
        channel: '${SLACK_CHANNEL:-#alerts}'
    email_configs:
      - to: '${ALERT_EMAIL_TO:-oncall@example.com}'
        from: '${ALERT_EMAIL_FROM:-alertmanager@example.com}'
        smarthost: '${SMTP_HOST:-smtp.example.com}:587'
        auth_username: '${SMTP_USERNAME:-alert@example.com}'
        auth_identity: '${SMTP_IDENTITY:-alert@example.com}'
        auth_password: '${SMTP_PASSWORD:-REPLACE_WITH_SECRET}'
