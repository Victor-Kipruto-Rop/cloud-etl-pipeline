version: 2

sources:
  - name: raw_ecommerce
    schema: raw
    tables:
      - name: orders
        description: Immutable landed order records from the ingestion layer.
        columns:
          - name: order_id
            tests: [not_null, unique]
          - name: customer_id
            tests: [not_null]
          - name: order_status
            tests: [not_null]
